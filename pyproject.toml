[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["net_interception_env"]

[project]
name = "net_interception_env"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = [
  "gymnasium",
  "pygame>=2.1.3",
  "pre-commit",
  "pytest>=9.1.1",
  "qpsolvers>=4.13.0",
  "clarabel>=0.11.1",
  "osqp>=1.1.3",
]
